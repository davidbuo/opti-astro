fragment BlogPage on BlogPage {
    _metadata {
        ...PageUrl
        published
        displayName
    }
    Title
    Subtitle
    Image {
        ...ContentUrl
    }
    Body {
        html
    }
    MainContentArea {
        _metadata {
            types
        }
        ...ContentArea
    }
    PageAdminSettings {
        ...PageAdminSettingsProperty
    }
}